<!doctype html>
<html lang="en">
  <head>
    <title>shadow-claw-daw - redirect service</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="shadow-claw-daw - redirect service" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        const l = window.location;
        const isLocalhost =
          l.hostname === "localhost" ||
          l.hostname === "127.0.0.1" ||
          l.hostname === "0.0.0.0";

        if (isLocalhost) return;

        // store the full path + query + hash
        sessionStorage.setItem(
          "shadow-claw-github-pages-404-redirect",
          l.pathname + l.search + l.hash,
        );

        // redirect to entry point
        l.replace("/shadow-claw-daw/");
      })();
    </script>
  </head>
  <body>
    <main
      style="
        font-family: system-ui, sans-serif;
        padding: 2rem;
        max-width: 40rem;
        margin: auto;
        line-height: 1.6;
      "
    >
      <h1>404 Not Found</h1>
      <p>
        The requested path does not exist on
        <strong>ShadowClaw DAW</strong>.
      </p>
      <h2>Where to look next</h2>
      <ul>
        <li><a href="/shadow-claw-daw/">ShadowClaw DAW</a></li>
        <li>
          <a href="/shadow-claw-daw/main/">Interactive Workbench</a>
        </li>
      </ul>
    </main>
  </body>
</html>
